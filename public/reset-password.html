<!doctype html>
<html lang="en">
  <head>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Finder | Reset Password</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="js/theme.js"></script>

    <div class="container reset-password-container">
      <h1>Reset Password</h1>

      <input
        id="password"
        type="password"
        placeholder="New password"
        class="reset-password-input"
      />

      <button id="reset-btn" class="reset-password-button">
        Reset Password
      </button>

      <p id="message" class="reset-password-message"></p>

      <a id="back-to-login" href="/" class="reset-password-back-link">
        ← Back to Login
      </a>
    </div>

    <script>
      const token = window.location.pathname.split("/").pop();

      const button = document.getElementById("reset-btn");
      const passwordInput = document.getElementById("password");
      const message = document.getElementById("message");
      const backToLoginLink = document.getElementById("back-to-login");

      function disableResetForm() {
        passwordInput.disabled = true;
        button.disabled = true;
      }

      function enableResetForm() {
        passwordInput.disabled = false;
        button.disabled = false;
      }

      function showBackToLogin() {
        backToLoginLink.classList.remove("hidden");
      }

      function setLoading() {
        button.disabled = true;
        button.classList.add("loading");
        button.innerHTML = `
          <span class="auth-spinner"></span>
          Resetting...
        `;
      }

      function resetLoading() {
        button.textContent = "Reset Password";
        button.classList.remove("loading");

        if (!passwordInput.disabled) {
          button.disabled = false;
        }
      }

      (async function validateToken() {
        disableResetForm();

        try {
          const response = await fetch(`/api/auth/reset-password/${token}`);
          const data = await response.json();

          if (!response.ok) {
            message.textContent = data.message;
            message.classList.add("error");
            showBackToLogin();
            return;
          }

          enableResetForm();
        } catch {
          message.textContent = "Unable to validate reset link.";
          message.classList.add("error");
          showBackToLogin();
        }
      })();

      document
        .getElementById("reset-btn")
        .addEventListener("click", async () => {
          const password = passwordInput.value;

          setLoading();

          try {
            const response = await fetch(`/api/auth/reset-password/${token}`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                password,
              }),
            });

            const data = await response.json();

            message.textContent = data.message;

            message.classList.remove("success", "error");

            if (response.ok) {
              message.classList.add("success");
              disableResetForm();
              showBackToLogin();
            } else {
              message.classList.add("error");

              if (data.message === "Invalid or expired password reset token.") {
                disableResetForm();
              }

              showBackToLogin();
            }
          } catch {
            message.textContent = "Request failed.";
            message.classList.remove("success");
            message.classList.add("error");

            showBackToLogin();
            disableResetForm();
          } finally {
            resetLoading();
          }
        });
    </script>
  </body>
</html>
