<!doctype html>
<html lang="en">
  <head>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Finder | Reset Password</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <script src="/js/theme.js"></script>

    <div class="container reset-password-container">
      <h1>Reset Password</h1>

      <input
        id="password"
        type="password"
        placeholder="New password"
        class="reset-password-input"
      />

      <button id="reset-btn" class="reset-password-button">
        Reset Password
      </button>

      <p id="message" class="reset-password-message"></p>

      <a id="back-to-login" href="/" class="reset-password-back-link">
        ← Back to Login
      </a>
    </div>

    <script src="/js/reset-password.js"></script>
  </body>
</html>
