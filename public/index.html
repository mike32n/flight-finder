<!doctype html>
<html lang="en">
  <head>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Finder | Perfect Weekend Getaways</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>✈️ Flight Finder</h1>

      <div id="auth-container"></div>

      <!-- Selected IATA badges -->
      <div id="selected-container" class="selected-container"></div>

      <div class="form">
        <div class="autocomplete-wrapper">
          <input
            id="destination-input"
            type="text"
            placeholder="Type city or IATA code..."
            autocomplete="off"
          />
          <div id="autocomplete-list" class="autocomplete-list hidden"></div>
        </div>

        <select id="weekday">
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
        </select>

        <div class="stepper">
          <button onclick="changeNights(-1)">−</button>
          <input
            id="nights"
            type="number"
            value="1"
            min="1"
            max="30"
            step="1"
          />
          <button onclick="changeNights(1)">+</button>
        </div>

        <button onclick="search()">Search</button>
      </div>

      <div id="loading" class="hidden">Loading...</div>
      <div id="results"></div>
      <div style="text-align: center; margin-bottom: 20px">
        <button onclick="toggleTheme()">🌙 Theme</button>
      </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="auth-modal hidden">
      <div class="auth-modal-content">
        <button id="auth-modal-close" class="auth-modal-close">×</button>

        <div id="login-form-container">
          <h2>Login</h2>

          <form id="login-form">
            <input
              id="login-email"
              type="email"
              placeholder="Email"
              autocomplete="email"
              required
            />

            <input
              id="login-password"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />

            <button type="submit">Login</button>
            <button
              type="button"
              id="forgot-password-btn"
              class="auth-switch-btn"
            >
              Forgot password?
            </button>
          </form>

          <div id="login-message" class="auth-message"></div>

          <button id="show-register-btn" class="auth-switch-btn">
            Create an account
          </button>
        </div>

        <div id="register-form-container" class="hidden">
          <h2>Register</h2>

          <form id="register-form">
            <input
              id="register-email"
              type="email"
              placeholder="Email"
              autocomplete="email"
              required
            />

            <input
              id="register-password"
              type="password"
              placeholder="Password"
              autocomplete="new-password"
              required
            />

            <button type="submit">Register</button>
          </form>

          <div id="register-message" class="auth-message"></div>

          <button id="show-login-btn" class="auth-switch-btn">
            Already have an account?
          </button>
        </div>

        <div id="forgot-form-container" class="hidden">
          <h2>Forgot Password</h2>

          <form id="forgot-form">
            <input
              id="forgot-email"
              type="email"
              placeholder="Email"
              autocomplete="email"
              required
            />

            <button type="submit">Send Reset Link</button>
          </form>

          <div id="forgot-message" class="auth-message"></div>

          <button id="back-to-login-btn" class="auth-switch-btn">
            ← Back to login
          </button>
        </div>
      </div>
    </div>
    <script src="/js/auth.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
