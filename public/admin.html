<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Flight Finder | Administration</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin.css" />

    <script src="/js/theme.js" defer></script>
    <script src="/js/admin.js" defer></script>
  </head>

  <body>
    <main class="container admin-container">
      <a
        class="corner-icon corner-icon--right"
        href="/"
        aria-label="Back to Flight Finder"
        title="Back to Flight Finder"
      >
        <span aria-hidden="true">←</span>
      </a>

      <header class="admin-header">
        <h1>Administration</h1>
      </header>

      <p id="admin-status" role="status">Loading plan policies...</p>

      <section id="admin-content" aria-labelledby="policies-heading" hidden>
        <h2 id="policies-heading">Plan policies</h2>
        <p class="admin-description">
          Update the settings for each plan, then save that plan.
        </p>

        <form id="policy-form-anonymous"></form>
        <form id="policy-form-registered"></form>
        <form id="policy-form-premium"></form>

        <div class="admin-table-wrapper">
          <table id="plan-policies-table" class="admin-table">
            <thead>
              <tr>
                <th scope="col">Setting</th>
                <th scope="col">Anonymous</th>
                <th scope="col">Registered</th>
                <th scope="col">Premium</th>
              </tr>
            </thead>
            <tbody id="plan-policies-body"></tbody>
            <tfoot>
              <tr>
                <th scope="row">Save changes</th>

                <td>
                  <button
                    type="submit"
                    form="policy-form-anonymous"
                    aria-label="Save Anonymous"
                    disabled
                  >
                    Save
                  </button>
                  <span
                    id="anonymous-save-status"
                    class="policy-save-status"
                    role="status"
                  ></span>
                </td>

                <td>
                  <button
                    type="submit"
                    form="policy-form-registered"
                    aria-label="Save Registered"
                    disabled
                  >
                    Save
                  </button>
                  <span
                    id="registered-save-status"
                    class="policy-save-status"
                    role="status"
                  ></span>
                </td>

                <td>
                  <button
                    type="submit"
                    form="policy-form-premium"
                    aria-label="Save Premium"
                    disabled
                  >
                    Save
                  </button>
                  <span
                    id="premium-save-status"
                    class="policy-save-status"
                    role="status"
                  ></span>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
